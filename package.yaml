name:                bucktracker
version:             0.1.0.0
github:              "jus2tin/bucktracker"
license:             MIT
author:              "Justin Termaat"
maintainer:          "justintermaat@gmail.com"
copyright:           "2026 Justin Termaat"

extra-source-files:
- README.md
- CHANGELOG.md

# Migrations are plain, reviewable .sql files (no TemplateHaskell/
# file-embed): they get installed via data-files and found at runtime via
# the generated Paths_bucktracker module. See DECISIONS.md §7.
# Static frontend assets (vendored, pinned, zero build step) use the
# exact same mechanism. See DECISIONS.md §12 and
# docs/phases/phase-02-hardening-and-forecasting.md, Track A Step 1.
data-files:
- migrations/*.sql
- static/*.css
- static/*.js

synopsis:            Personal zero-based / envelope budget and money tracker
category:            Finance

description:         Please see the README on GitHub at <https://github.com/jus2tin/bucktracker#readme>

dependencies:
- base >= 4.7 && < 5
- text
- time

language: GHC2021

default-extensions:
- OverloadedStrings
- StrictData
- DeriveGeneric
- DataKinds
- TypeOperators
- DerivingStrategies
- DerivingVia
- DeriveAnyClass

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -Wunused-packages

library:
  source-dirs: src
  dependencies:
  - aeson
  - bytestring
  - containers
  - direct-sqlite    # for Db.Backup: the online backup API isn't in sqlite-simple itself
  - directory        # XDG data path for the default DB file
  - envparse
  - filepath
  - http-api-data     # Web.FormUrlEncoded (FromForm) for HTMX forms
  - lucid
  - mtl
  - resource-pool
  - servant
  - servant-lucid     # MimeRender HTML (Html ()) for Servant handlers
  - servant-server
  - sqlite-simple
  - transformers
  - uuid
  - wai
  - wai-app-static
  - warp

executables:
  bucktracker-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - bucktracker
    - filepath
    - warp

tests:
  bucktracker-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    build-tools:
    - hspec-discover:hspec-discover
    dependencies:
    - bucktracker
    - hspec
    - QuickCheck
    - hspec-wai
    - sqlite-simple
    - directory
    - wai
    - wai-extra
    - http-types
    - bytestring
    - filepath
